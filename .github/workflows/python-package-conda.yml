name: Python package build with Conda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          auto-activate-base: false

      - name: Install test runner
        shell: bash -el {0}
        run: conda install --yes pytest

      - name: Syntax check all modules
        shell: bash -el {0}
        run: python -m compileall -q .

      - name: Run test suite
        shell: bash -el {0}
        run: |
          python -m pytest test_qarmrlite.py test_qarmr_v9.py -v
          python qarke_tamper_test.py
